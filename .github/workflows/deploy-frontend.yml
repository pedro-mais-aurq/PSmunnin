name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - correcao
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve deployment variables
        shell: bash
        env:
          CONFIGURED_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CONFIGURED_API_URL}" ]; then
            echo "::error::Configure NEXT_PUBLIC_API_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi

          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "${REPOSITORY_NAME}" == *.github.io ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPOSITORY_NAME}"
          fi

          echo "NEXT_PUBLIC_API_URL=${CONFIGURED_API_URL%/}" >> "${GITHUB_ENV}"
          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "${GITHUB_ENV}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate types and type-check
        working-directory: frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build static frontend
        working-directory: frontend
        run: npm run build

      - name: Validate static output
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f out/index.html
          test -d out/_next

          if [ ! -f out/404.html ]; then
            cp out/index.html out/404.html
          fi

          touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
